name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Reproduce bundled analysis
        run: python scripts/reproduce_analysis.py --config configs/paper.yaml
      - name: Validate manuscript-facing values
        run: python scripts/validate_manuscript_numbers.py
